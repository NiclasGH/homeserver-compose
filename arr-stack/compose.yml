---
networks:
  proxy:
    name: homeserver_proxy
    external: true

services:
  # VPN
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    # ports:
    #   - 8989:8989 # tv / sonarr
    #   - 9696:9696 # prowlarr
    #   - 7878:7878 # movies / radarr
    #   - 8080:8080 # sabnzbd
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun-config:/gluetun
    networks:
      - proxy
    restart: unless-stopped
    env_file: config/vpn.env
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard

  # Indexer
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    # ports:
    #   - 9696:9696
    volumes:
      - prowlarr-config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`index.tira-misu.org`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # TV
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    # ports:
    #   - 8989:8989
    volumes:
      - sonarr-config:/config
      - nzb-downloads:/downloads
      - type: bind
        source: /mnt/data/media
        target: /data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`shows.tira-misu.org`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Movies
  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    # ports:
    #   - 7878:7878
    volumes:
      - radarr-config:/config
      - nzb-downloads:/downloads
      - type: bind
        source: /mnt/data/media
        target: /data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`movies.tira-misu.org`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Download Client
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.0.3
    container_name: sabnzbd
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - sabnzbd-config:/config
      - nzb-downloads:/downloads
    # ports:
    #   - 8080:8080
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzb.rule=Host(`download.tira-misu.org`)"
      - "traefik.http.services.nzb.loadbalancer.server.port=8080"
      - "traefik.http.routers.nzb.entrypoints=websecure"
      - "traefik.http.routers.nzb.tls=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sabnzbd-config:
  gluetun-config:
  prowlarr-config:
  radarr-config:
  sonarr-config:

  nzb-downloads:
