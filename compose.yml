services:
  # === MEDIA SERVER - 8000, 8004
  jellyfin:
    image: jellyfin/jellyfin
    container_name: media-server
    ports:
      - 8000:8096/tcp
      - 80:8096/tcp
      - 7359:7359/udp
    volumes:
      - type: bind
        source: jellyfish/config
        target: /config
      - jellyfish-cache:/cache
      - type: bind
        source: jellyfish/media
        target: /media
    restart: 'unless-stopped'

  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    ports:
      - 8004:80/tcp
    volumes:
      - type: bind
        source: jellyfish/media
        target: /srv
      - filebrowser-database:/database
      - filebrowser-config:/config
    restart: 'unless-stopped'

  # === KEYCLOAK - 8002
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    depends_on:
      - keycloak-db
    ports:
      - "8002:8080"
    networks:
     - keycloak-network
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_HEALTH_ENABLED: true
    env_file: keycloak.env
    # source for the healthcheck: https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 5s
    command: "start-dev"

  keycloak-db:
    image: postgres:17
    container_name: keycloak-db
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    env_file: keycloak.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 5s
    networks:
     - keycloak-network

  # === KUMA - 8003
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports:
      - "8003:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

  # === PIHOLE - 53, 8001
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8001:80/tcp"
      # - "443:443/tcp"
    env_file: pihole.env
    environment:
      TZ: 'Europe/Berlin'
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - pihole-data:/etc/pihole
      - type: bind
        source: pihole/pihole.toml
        target: /etc/pihole/pihole.toml
        read_only: true
    restart: unless-stopped

volumes:
  jellyfish-cache:

  filebrowser-data:
  filebrowser-database:
  filebrowser-config:

  keycloak-data:

  uptime-kuma-data:

  pihole-data:

networks:
  keycloak-network:
