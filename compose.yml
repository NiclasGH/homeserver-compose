services:
  # === NGINX - 80, 443
  proxy:
    image: nginx
    networks:
      - proxy_network
    ports:
      - 443:443
      - 80:80
    volumes:
      - type: bind
        source: nginx
        target: /etc/nginx/conf.d/
      # - certs:/etc/nginx/certs

  # === MEDIA SERVER
  jellyfin:
    image: jellyfin/jellyfin
    ports:
      - 8000:8096/tcp # for devices, that block local dns
      - 7359:7359/udp
    networks:
      - proxy_network
    volumes:
      - type: bind
        source: jellyfin/config
        target: /config
      - jellyfin-cache:/cache
      - type: bind
        source: jellyfin/media
        target: /media
      # branding (could be done with entrypoint script but this is easier to change
      - type: bind
        source: jellyfin/branding/icon-transparent.baba78f2a106d9baee83.png
        target: /jellyfin/jellyfin-web/icon-transparent.baba78f2a106d9baee83.png
      - type: bind
        source: jellyfin/branding/banner-light.b113d4d1c6c07fcb73f0.png
        target: /jellyfin/jellyfin-web/banner-light.b113d4d1c6c07fcb73f0.png
      - type: bind
        source: jellyfin/branding/favicon.bc8d51405ec040305a87.ico
        target: /jellyfin/jellyfin-web/favicon.bc8d51405ec040305a87.ico
      - type: bind
        source: jellyfin/branding/touchicon144.39209dd2362c0db7c673.png
        target: /jellyfin/jellyfin-web/touchicon144.39209dd2362c0db7c673.png
      - type: bind
        source: jellyfin/branding/favicons
        target: /jellyfin/jellyfin-web/favicons
    restart: 'unless-stopped'

  filebrowser:
    image: filebrowser/filebrowser
    ports:
      - 8001:80/tcp
    networks:
      - proxy_network
    volumes:
      - type: bind
        source: jellyfin/media
        target: /srv
      - filebrowser-database:/database
      - filebrowser-config:/config
    restart: 'unless-stopped'

  # === KUMA
  uptime-kuma:
    image: louislam/uptime-kuma:2
    # ports:
    #   - "3001:3001"
    ports:
      - 8002:3001
    networks:
     - proxy_network
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

  # === PIHOLE
  pihole:
    image: pihole/pihole:latest
    networks:
     - proxy_network
    ports:
      - "8003:80/tcp"
      - "53:53/tcp"
      - "53:53/udp"
    env_file: pihole.env
    environment:
      TZ: 'Europe/Berlin'
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - pihole-data:/etc/pihole
      - type: bind
        source: pihole/pihole.toml
        target: /etc/pihole/pihole.toml
    restart: unless-stopped

  # === RATHOLE - Wireguard
  rathole:
    image: ghcr.io/rathole-org/rathole:dev
    network_mode: host
    volumes:
      - type: bind
        source: rathole/client.toml
        target: /app/config.toml
    restart: unless-stopped
    entrypoint: "./rathole --client /app/config.toml"

volumes:
  jellyfin-cache:

  filebrowser-data:
  filebrowser-database:
  filebrowser-config:

  keycloak-data:

  uptime-kuma-data:

  pihole-data:

networks:
  keycloak-network:

  proxy_network:
  wireguard_network:
