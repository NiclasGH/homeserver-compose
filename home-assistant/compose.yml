services:
  faster-whisper:
    image: lscr.io/linuxserver/faster-whisper:latest
    container_name: faster-whisper
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - WHISPER_LANG=de
      - WHISPER_MODEL=auto
    volumes:
      - whisper-data:/config
    ports:
      - 10300:10300
    restart: unless-stopped

volumes:
  whisper-data:
