server {
    listen 443 ssl;
    http2 on;
    server_name filebrowser.tira-misu.org www.filebrowser.tira-misu.org;

    client_max_body_size 0;  # 0 = unlimited

    ssl_certificate     /etc/nginx/certs/tira-misu.org_ecc/tira-misu.org.cer;
    ssl_certificate_key /etc/nginx/certs/tira-misu.org_ecc/tira-misu.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://filebrowser:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_request_buffering off;  # stream directly to backend, no temp files
        proxy_buffering off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 600s;
    }
}

server {
    listen 80;
    server_name filebrowser.tira-misu.org www.filebrowser.tira-misu.org;
    return 301 https://$host$request_uri;
}
