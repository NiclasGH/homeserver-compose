server {
    listen 80;
    server_name media.tira-misu.org www.media.tira-misu.org;

    # Redirect HTTP to HTTPS (uncomment when you have SSL certificates)
    # return 301 https://$server_name$request_uri;

    # Temporary HTTP access (remove when SSL is configured)
    location / {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed by Pi-hole admin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
